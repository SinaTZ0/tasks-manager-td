<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tofang's mark: the orange action key seated in its black cut. The darker band is the key's lower lip. -->
  <rect x="1" y="1" width="62" height="62" rx="7" fill="#111111"/>
  <rect x="7" y="7" width="50" height="50" rx="11" fill="#b82c09"/>
  <rect x="7" y="7" width="50" height="45" rx="11" fill="#f23a0c"/>
</svg>
